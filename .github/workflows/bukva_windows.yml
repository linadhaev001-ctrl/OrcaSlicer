# BukvaSlicer: сборка только установщика Windows x64.
# Запуск: вкладка Actions → «BukvaSlicer Windows» → Run workflow.
# Готовый установщик лежит в разделе Artifacts у завершённого запуска.
name: BukvaSlicer Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'bukva-*'

jobs:
  build_windows:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
    secrets: inherit
